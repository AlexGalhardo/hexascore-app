# Local dev stack. Usage (from the repo root):
#   docker compose -f infra/docker-compose.yaml up -d --wait          # Postgres + Redis + Upstash REST proxy
#   docker compose -f infra/docker-compose.yaml --profile app up -d   # + the web app in a container
#
# DEV ONLY: every credential below (hexascore / local-dev-token) is a fixed local default and public in this repo.
# Ports are bound to 127.0.0.1 so nothing is reachable from the network; never reuse these values anywhere else.
name: hexascore

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: hexascore
      POSTGRES_PASSWORD: hexascore
      POSTGRES_DB: hexascore
    ports:
      - "127.0.0.1:5432:5432"
    # Postgres 18+ images keep PGDATA under /var/lib/postgresql/<major>/docker, so the volume mounts the parent.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexascore -d hexascore"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Not published to the host: the app only talks to Redis through the REST proxy below.
  redis:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--requirepass", "hexascore"]
    environment:
      REDISCLI_AUTH: hexascore
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Upstash-compatible REST API over the local Redis, so @upstash/redis works without an Upstash account.
  redis-http:
    image: hiett/serverless-redis-http:0.0.10
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-dev-token
      SRH_CONNECTION_STRING: redis://:hexascore@redis:6379
    ports:
      - "127.0.0.1:8079:80"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - --header 'Authorization: Bearer local-dev-token' --header 'Content-Type: application/json'
          --post-data '["PING"]' http://127.0.0.1:80/ | grep -q PONG
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    profiles: ["app"]
    image: hexascore-web:local
    build:
      context: ..
      dockerfile: infra/Dockerfile
    env_file:
      - path: ../apps/web/.env.local
        required: false
    environment:
      DATABASE_URL: postgres://hexascore:hexascore@postgres:5432/hexascore
      UPSTASH_REDIS_REST_URL: http://redis-http:80
      UPSTASH_REDIS_REST_TOKEN: local-dev-token
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis-http:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
