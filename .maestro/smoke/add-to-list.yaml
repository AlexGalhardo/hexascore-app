# P5.B.4.1 smoke (staging, owner-gated): sign in first (login flow, P5.B.5.2), then create a list and open it.
appId: app.hexascore
---
- launchApp
- tapOn: "My lists"
- tapOn: "Title"
- inputText: "Maestro smoke"
- tapOn: "Create list"
- tapOn: "Maestro smoke"
- assertVisible: "This list is empty. Add items from any item page."
