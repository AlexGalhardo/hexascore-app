# P5.B.5.1 smoke (preview build pointed at a local stack, owner-gated).
# Set SLUG and ENTITY_ID to a DemoCatalog game slug and entity id in the local stack.
appId: app.hexascore
---
- launchApp
- openLink: https://hexascore.app/pt-br/games/${SLUG}
- assertVisible:
    id: "item"
- openLink: https://hexascore.app/entities/${ENTITY_ID}
- assertNotVisible: "Unknown section"
