# Schemathesis 4.29.0. Base URL and the bearer header come from the CLI.
# The container's working directory is qa/reports/schemathesis (gitignored).

rate-limit = "8/s"
workers = 1
request-timeout = 15
max-failures = 20

[generation]
max-examples = 50

[checks]
# Read-only catalogue. These two checks need a create/delete link between operations.
use_after_free.enabled = false
ensure_resource_availability.enabled = false
# The Go server answers TRACE with 400 before the router runs. Every other
# undeclared method is 405. The check cannot be satisfied from application code.
unsupported_method.enabled = false
# Query and path values are strings in the document. A value the handler rejects
# (unknown type, bad cursor, bad year) is 400 invalid-query, which is not a 5xx.
# Every operation of both documents: api-v1 paths are relative to /v1 (/books/...), app-v1 paths start with /app/v1.
[[operations]]
include-path-regex = "^/"
# 415: JSONOnly and the telemetry decoder reject a body that is not JSON.
checks.positive_data_acceptance.expected-statuses = ["2xx", "400", "401", "403", "404", "409", "415", "422", "428", "429", "5xx"]

# GET /{path...} is the HTML 404, so a method probe on /app/v1 advertises GET.
[[operations]]
include-path-regex = "^/app/v1/"
checks.allow_header_conformance.enabled = false

# DELETE /app/v1/tokens/current is 204 with an empty body. The untyped route's
# generated schema is */* , which the checker tries to parse as JSON.
[[operations]]
include-path-regex = "^/app/v1/tokens/current$"
checks.response_schema_conformance.enabled = false
checks.content_type_conformance.enabled = false

# POST /app/v1/client-errors and /client-metrics answer 204 with an empty body.
# The untyped route schema is */* , same gap as tokens/current.
[[operations]]
include-path-regex = "^/app/v1/client-(errors|metrics)$"
checks.response_schema_conformance.enabled = false
checks.content_type_conformance.enabled = false
