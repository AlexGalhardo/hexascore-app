# A14 Trending stale (SDD 12 section 7.5): the newest trending snapshot is older than 3 h (SDD 08 section 7.3).
# ComputeTrending runs at minute 5 of every hour, so three missed runs raise it. Warn, Grafana.
apiVersion: 1
groups:
  - orgId: 1
    name: hexascore-trending
    folder: HexaScore
    interval: 1m
    rules:
      - uid: a14-trending-stale
        title: A14 Trending stale
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warn
          alert: A14
        annotations:
          summary: The newest trending snapshot is older than 3 hours.
          runbook: ComputeTrending job (routes/schedule.go); readers keep serving the last snapshot meanwhile.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: grafanacloud-prom
            model:
              expr: max(trending_snapshot_age_seconds)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [10800] }
              refId: C
