# A9 Moderation (SDD 12 §7.5, SDD 04 NFR-04-2). Prometheus rule format, so the Grafana ruler imports it and
# promtool can test it. Metric names are the OTLP-to-Prometheus forms of the suggest.queue.* gauges.
groups:
  - name: moderation
    rules:
      - alert: A9ModerationBacklog
        expr: max(suggest_queue_oldest_seconds) > 72000 or max(suggest_queue_age_p95_seconds) > 86400
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: Oldest open suggestion over 20 h or p95 open age over 24 h
          runbook_url: https://github.com/AlexGalhardo/hexascore-app/blob/main/docs/sdd/12-observability.md#78-runbooks
          description: Runbook R5 (suggestion backlog); start at /admin/moderation/metrics.
