name: CI

# Adapted from AlexGalhardo/vukem. main accepts a change only through a pull
# request whose required checks are green (ruleset protect-main). Railway
# deploys main on its own after that merge.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  MARKDOWNLINT_VERSION: 0.24.0
  OSV_SCANNER_VERSION: v2.7.0
  OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b

jobs:
  lint:
    name: Lint (golangci-lint, format, vet, Biome, tsc, markdownlint, commit messages)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: hexascore
          POSTGRES_PASSWORD: hexascore
          POSTGRES_DB: hexascore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hexascore" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # commitlint compares the PR base to the head. Depth 1 only has the
          # merge commit, so that range is an invalid revision.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --build-tags integration ./...
      - name: Format diff
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }} fmt --diff
      - run: go vet ./...
      - name: OpenAPI goldens
        env:
          DATABASE_URL: postgres://hexascore:hexascore@127.0.0.1:5432/hexascore?sslmode=disable
        run: bash scripts/openapi-check.sh
      - name: OpenAPI lint
        run: bun run openapi:lint
      - run: bun run lint
      - run: bun run typecheck
      - run: bunx markdownlint-cli2@${{ env.MARKDOWNLINT_VERSION }} "**/*.md"
      - name: Commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
      - name: PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx commitlint

  test:
    name: Tests (Go unit and integration on Postgres, TypeScript)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: hexascore
          POSTGRES_PASSWORD: hexascore
          POSTGRES_DB: hexascore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hexascore" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://hexascore:hexascore@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: go test -race -count=1 ./...
      # The runner's client is Postgres 16. pg_dump refuses a 18.6 server, so the
      # integration backup drill uses the same image as the service, on PATH.
      - name: Postgres 18 client
        run: |
          img='postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5'
          write_client() {
            sudo tee "/usr/local/bin/$1" >/dev/null <<EOF
          #!/bin/sh
          set -eu
          ssl=
          if [ -n "\${PGSSLMODE:-}" ]; then ssl="-e PGSSLMODE"; fi
          exec docker run --rm -i --network host -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE \$ssl "$img" "$1" "\$@"
          EOF
            sudo chmod +x "/usr/local/bin/$1"
          }
          write_client pg_dump
          write_client pg_restore
      # bun is on PATH so TestPluralGolden compares Go and TypeScript output.
      - run: go test -race -count=1 -tags integration ./...
      - run: bun run test
      - name: Migration policy
        run: bun test scripts/ci/migration-policy.test.ts
      - name: TypeScript SDK
        working-directory: sdks/ts
        run: bun install --frozen-lockfile --ignore-scripts && bun run typecheck && bun test

  migrations:
    name: Migrations (Postgres 18.6 round trip)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: hexascore
          POSTGRES_PASSWORD: hexascore
          POSTGRES_DB: hexascore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hexascore" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: migrate, roll back one step, migrate
        env:
          APP_ENV: development
          DATABASE_URL: postgres://hexascore:hexascore@localhost:5432/hexascore?sslmode=disable
          SESSION_DRIVER: cookie
          MAIL_MAILER: log
        run: |
          set -euo pipefail
          export APP_KEY="base64:$(openssl rand -base64 32)"
          go run ./cmd/app migrate
          go run ./cmd/app migrate:rollback --step 1
          go run ./cmd/app migrate

  vuln:
    name: Vulnerability scan (govulncheck, weekly)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go tool govulncheck ./...

  deps:
    name: Dependency audit (osv-scanner, bun audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install osv-scanner (pinned release, checksum verified)
        run: |
          curl -fsSLo osv-scanner "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - run: ./osv-scanner scan source --config=osv-scanner.toml -L go.mod -L bun.lock -L sdks/ts/bun.lock
      - run: bun install --frozen-lockfile --ignore-scripts
      # Same four advisories as osv-scanner.toml. No compatible patched release.
      - run: bun audit --audit-level=high --ignore GHSA-mrhx-c7xc-m3w5 --ignore GHSA-gcqx-w48m-w2h4 --ignore GHSA-3g3m-2fjr-6pw4 --ignore GHSA-g3hv-75wg-m249

  setup-windows:
    name: Windows setup script and unit tests
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install the vukem CLI (version from go.mod)
        run: go install "github.com/AlexGalhardo/vukem/cmd/vukem@$((go list -m -f '{{.Version}}' github.com/AlexGalhardo/vukem))"
      - run: .\setups\setup-windows.ps1 -NoServices
      - run: go test -count=1 ./...

  build:
    name: Docker image (build, checks, /up smoke test, artifact)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t hexascore:ci .
      - name: Image checks
        run: scripts/infra/check-image.sh hexascore:ci
      - name: Smoke test
        run: |
          docker run -d --name app -p 3000:3000 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e APP_URL=http://localhost:3000 \
            -e STRIPE_KEY=sk_test_placeholder_ci \
            -e STRIPE_WEBHOOK_SECRET=whsec_placeholder_ci \
            -e STRIPE_PRICE_PRO=price_placeholder_pro \
            -e STRIPE_PRICE_BUSINESS=price_placeholder_business \
            hexascore:ci
          for i in $(seq 1 30); do curl -fsS localhost:3000/up && break; sleep 1; done
          # No database in this job, so readiness is 503 on "db"; only the ssr check matters here.
          curl -sS 'localhost:3000/up?checks=1' | grep -q '"ssr":"ok"'
      - name: Container logs
        if: failure()
        run: docker logs app
      - name: Save image
        run: docker save hexascore:ci -o image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar

  openapi:
    name: OpenAPI (export diff, Redocly, Schemathesis)
    needs: build
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgres://hexascore:hexascore@127.0.0.1:5432/hexascore?sslmode=disable
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: hexascore
          POSTGRES_PASSWORD: hexascore
          POSTGRES_DB: hexascore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hexascore" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: image
      - name: Load the build artifact
        run: docker load -i image.tar
      - name: Export matches the committed documents
        run: bash scripts/openapi-check.sh --image hexascore:ci
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Redocly
        run: bunx redocly lint openapi/api-v1.json openapi/app-v1.json
      - name: App client matches codegen
        run: |
          set -euo pipefail
          export APP_KEY="base64:$(openssl rand -base64 32)"
          out=$(mktemp)
          docker run --rm --network host \
            -e APP_ENV=development \
            -e APP_KEY \
            -e DATABASE_URL \
            -e API_HOST- \
            hexascore:ci codegen:client -prefix /app/v1 -o - >"$out"
          if ! git diff --no-index --exit-code packages/app-client/src/api.ts "$out"; then
            rm -f "$out"
            exit 1
          fi
          rm -f "$out"
          bun run --filter @hexascore/app-client typecheck test
      - name: Schemathesis against the loaded image
        run: bash qa/schemathesis/ci.sh hexascore:ci

  e2e:
    name: Playwright (3 locales, desktop and mobile)
    # Disabled by the owner on 2026-10-31: e2e no longer gates CI or releases. Set the repo variable RUN_E2E=true to re-enable.
    if: vars.RUN_E2E == 'true'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: image
      - name: Load the build artifact
        run: docker load -i image.tar
      - name: App from the artifact, seeded with DemoCatalog
        run: |
          export APP_KEY="base64:$(openssl rand -base64 32)"
          bash scripts/ci/qa-up.sh hexascore:ci
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx playwright install --with-deps chromium
      - name: e2e
        run: bun run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: |
            qa/e2e/test-results/
            playwright-report/
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse (SDD 09 budgets)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: image
      - name: Load the build artifact
        run: docker load -i image.tar
      - name: App from the artifact, seeded with DemoCatalog
        run: |
          export APP_KEY="base64:$(openssl rand -base64 32)"
          bash scripts/ci/qa-up.sh hexascore:ci
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Lighthouse
        run: bunx --bun @lhci/cli@0.15.1 autorun
        env:
          CHROME_PATH: /usr/bin/google-chrome

  mobile:
    name: Mobile (lint, typecheck, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run --cwd apps/mobile lint
      - run: bun run --cwd apps/mobile typecheck
      - run: bun run --cwd apps/mobile test
