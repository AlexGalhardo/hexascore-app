name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - run: bun run lint:ci
      # The committed openapi.json must match the zod schemas (contract drift fails the PR).
      - run: bun run openapi:check

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - run: bun run typecheck

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      # Empty DATABASE_URL: tests use in-process PGlite, so no Postgres service is needed.
      - run: bun test
        working-directory: apps/web

  build:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-24.04
    env:
      # Dummy but valid for apps/web/lib/env.ts (zod); optional integrations stay off because their keys are empty.
      NEXT_PUBLIC_APP_NAME: Hexascore
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-0123456789abcdef
      CRON_SECRET: ci-only-cron-secret-0123456789abcdef0123
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - run: bun run build

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - run: bun audit --audit-level=high
