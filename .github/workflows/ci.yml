name: CI

# Adapted from AlexGalhardo/vukem-marketplace-reactjs. Owner rule (2026-10-29):
# work merges straight into main and nobody waits for this run, so it reports
# regressions after the fact; Railway deploys main on its own.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  MARKDOWNLINT_VERSION: 0.24.0

jobs:
  lint:
    name: Lint (golangci-lint, format, vet, Biome, tsc, markdownlint, commit messages)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --build-tags integration ./...
      - name: Format diff
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }} fmt --diff
      - run: go vet ./...
      - name: OpenAPI goldens
        run: bash scripts/openapi-check.sh
      - run: bun run lint
      - run: bun run typecheck
      - run: bunx markdownlint-cli2@${{ env.MARKDOWNLINT_VERSION }} "**/*.md"
      - name: Commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
      - name: PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx commitlint

  test:
    name: Tests (Go unit and integration on Postgres, TypeScript)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: hexascore
          POSTGRES_PASSWORD: hexascore
          POSTGRES_DB: hexascore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hexascore" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://hexascore:hexascore@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: go test -race -count=1 ./...
      # bun is on PATH so TestPluralGolden compares Go and TypeScript output.
      - run: go test -race -count=1 -tags integration ./...
      - run: bun run test
      - name: TypeScript SDK
        working-directory: sdks/ts
        run: bun install --frozen-lockfile --ignore-scripts && bun run typecheck && bun test

  vuln:
    name: Vulnerability scan (govulncheck, weekly)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go tool govulncheck ./...

  setup-windows:
    name: Windows setup script and unit tests
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install the vukem CLI (version from go.mod)
        run: go install "github.com/AlexGalhardo/vukem/cmd/vukem@$((go list -m -f '{{.Version}}' github.com/AlexGalhardo/vukem))"
      - run: .\setups\setup-windows.ps1 -NoServices
      - run: go test -count=1 ./...

  build:
    name: Docker image (build, checks, /up smoke test, artifact)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t hexascore:ci .
      - name: Image checks
        run: scripts/infra/check-image.sh hexascore:ci
      - name: Smoke test
        run: |
          docker run -d --name app -p 3000:3000 -e APP_KEY="base64:$(openssl rand -base64 32)" -e APP_URL=http://localhost:3000 hexascore:ci
          for i in $(seq 1 30); do curl -fsS localhost:3000/up && break; sleep 1; done
          # No database in this job, so readiness is 503 on "db"; only the ssr check matters here.
          curl -sS 'localhost:3000/up?checks=1' | grep -q '"ssr":"ok"'
      - name: Container logs
        if: failure()
        run: docker logs app
      - name: Save image
        run: docker save hexascore:ci -o image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar
