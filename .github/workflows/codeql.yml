name: CodeQL

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    # Code scanning on a private repo needs GitHub Code Security; set the repo variable
    # CODE_SCANNING_ENABLED=true once it is available (public repos always run).
    if: ${{ !github.event.repository.private || vars.CODE_SCANNING_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7
      # CodeQL fails on a language with no source files; Python only exists once webscrappings/ lands.
      - id: sources
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          if [ "$LANGUAGE" != "python" ] || [ -n "$(git ls-files '*.py' | head -n 1)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.sources.outputs.present == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - if: steps.sources.outputs.present == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
