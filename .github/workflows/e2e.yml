name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: "postgres://postgres:postgres@localhost:5432/perguntae_db?schema=public"
  NEXTAUTH_SECRET: "ci-only-secret"
  NEXTAUTH_URL: "http://localhost:3200"
  NEXT_PUBLIC_APP_URL: "http://localhost:3200"
  RESEND_API_KEY: "re_ci_dummy"
  ABACATEPAY_WEBHOOK_SECRET: "ci-dummy"
  ABACATEPAY_API_KEY: "ci-dummy"
  UPLOADTHING_TOKEN: "ci-dummy"
  NEXT_PUBLIC_TEST_MODE: "true"
  # Chaves de teste oficiais da Cloudflare: o captcha sempre passa (o e2e roda com `next start`, em produção).
  NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
  CLOUDFLARE_TURNSTILE_SECRET: "1x0000000000000000000000000000000AA"
  DANGER_MODE: "false"
  CI: "true"

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: perguntae_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run prisma:generate
      - run: bunx prisma migrate deploy
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
