name: Python CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "webscrappings/**"
      - ".github/workflows/python-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: webscrappings

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: hexascore
          POSTGRES_PASSWORD: hexascore
          POSTGRES_DB: hexascore
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: webscrappings/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      # DB tests are opt-in (TEST_DATABASE_URL); they run once the app's migrations exist on the branch.
      - name: Apply app migrations
        id: migrate
        if: hashFiles('apps/web/lib/db/migrations/0001_init.sql') != ''
        env:
          PGPASSWORD: hexascore
        run: |
          for f in ../apps/web/lib/db/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -h localhost -U hexascore -d hexascore -f "$f"
          done
          echo "url=postgresql://hexascore:hexascore@localhost:5432/hexascore" >> "$GITHUB_OUTPUT"
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: ${{ steps.migrate.outputs.url }}
