name: QA

# Merge gate for dev → main (advisory: branch protection is off by the owner's decision, see docs/process.md).
# Runs the Playwright + axe suite against the Vercel preview of the PR head.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: Deployment URL to test (defaults to the Vercel preview of the current commit)
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'dev'
    runs-on: ubuntu-24.04
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - id: url
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_URL: ${{ inputs.url }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$INPUT_URL" ]; then echo "url=$INPUT_URL" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Vercel reports each deployment through the GitHub Deployments API; wait up to 20 min for a successful one.
          for _ in $(seq 1 80); do
            for id in $(gh api "repos/$REPO/deployments?sha=$SHA&per_page=20" --jq '.[].id'); do
              url=$(gh api "repos/$REPO/deployments/$id/statuses" --jq '[.[] | select(.state == "success")][0].environment_url // empty')
              if [ -n "$url" ]; then echo "url=$url" >> "$GITHUB_OUTPUT"; echo "Preview: $url"; exit 0; fi
            done
            sleep 15
          done
          echo "::error::No successful Vercel deployment for $SHA" && exit 1

  e2e:
    needs: preview
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      E2E_BASE_URL: ${{ needs.preview.outputs.url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # Optional: account flows (@auth) skip without them. Point them at the preview's database and auth secret.
      E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      E2E_BETTER_AUTH_SECRET: ${{ secrets.E2E_BETTER_AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - run: bunx playwright install --with-deps chromium
        working-directory: qa/e2e
      - run: bunx playwright test
        working-directory: qa/e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: qa/e2e/playwright-report
          retention-days: 14
