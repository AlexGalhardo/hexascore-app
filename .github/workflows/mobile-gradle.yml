name: Mobile Gradle fallback

# D-34 fallback for EAS Build (SDD 10 section 7.8, docs/runbooks/mobile-build-fallback.md). Manual only.
# Secrets reach only the steps that sign or check the signature, not bun install or the tests.
# Builds the signed AAB (Play) and APK (sideload) from `expo prebuild` output with the upload key held in
# Actions secrets. Fails closed when any signing secret is missing or the outputs are not signed with that key.
# It never submits: the AAB is uploaded as a workflow artifact and the owner uploads it to Play Console.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        type: string
        default: main
      version_code:
        description: Android versionCode, higher than the last one sent to Play (EAS remote value + 1)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: mobile-gradle
  cancel-in-progress: false

jobs:
  build:
    name: Gradle release build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: "1"
      NODE_ENV: production
      EXPO_PUBLIC_API_BASE_URL: https://hexascore.app
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      BUILD_REF: ${{ inputs.ref }}
    steps:
      - name: Check inputs and signing secrets
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$ANDROID_VERSION_CODE" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "version_code must be a positive integer" >&2; exit 1; }
          missing=""
          for v in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -z "$missing" ] || { echo "missing secrets:$missing" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Lint, typecheck, tests and release bundle
        working-directory: apps/mobile
        run: |
          bun run lint
          bun run typecheck
          bun run test -- --runInBand --forceExit
          bun run bundle:check
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Expo prebuild
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --clean --no-install
      - name: Decode upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
      - name: Gradle bundleRelease and assembleRelease
        working-directory: apps/mobile/android
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        # The android.injected.signing.* properties override the debug signingConfig prebuild writes for release.
        run: |
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_UPLOAD_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_UPLOAD_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_UPLOAD_KEY_PASSWORD"
      - name: Verify signatures and bundle
        working-directory: apps/mobile/android/app/build/outputs
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          norm() { tr -d ': ' | tr 'A-F' 'a-f'; }
          want=$(keytool -list -v -keystore "$RUNNER_TEMP/upload.keystore" -storepass:env ANDROID_UPLOAD_KEYSTORE_PASSWORD \
            -alias "$ANDROID_UPLOAD_KEY_ALIAS" | awk '/SHA256:/{print $2; exit}' | norm)
          aab=$(keytool -printcert -jarfile bundle/release/app-release.aab | awk '/SHA256:/{print $2; exit}' | norm)
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          apk=$("$apksigner" verify --print-certs apk/release/app-release.apk | awk '/certificate SHA-256 digest/{print $NF; exit}' | norm)
          [ -n "$want" ] && [ "$aab" = "$want" ] && [ "$apk" = "$want" ] || {
            echo "outputs are not signed with the upload key (want $want, aab $aab, apk $apk)" >&2; exit 1; }
          [ "$(unzip -l bundle/release/app-release.aab | grep -c BundleConfig.pb)" = 1 ]
          {
            echo "Signed with upload key SHA-256 \`$want\`, versionCode $ANDROID_VERSION_CODE, ref \`$BUILD_REF\`."
            echo '```'
            sha256sum bundle/release/app-release.aab apk/release/app-release.apk
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release.aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release.apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
