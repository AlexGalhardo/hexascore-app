name: Release Please

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A PAT makes the release PR trigger CI; falls back to GITHUB_TOKEN (CI then needs a close/reopen).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
