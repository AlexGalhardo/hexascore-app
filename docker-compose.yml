# Local stack for development and tests. Ports bind to 127.0.0.1 only.
# Postgres is published on 5433 because 5432 is taken by the spike container.
# https://vukem.dev/docs/testing/overview (Testing against PostgreSQL)
name: hexascore

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: hexascore
      POSTGRES_PASSWORD: hexascore
      POSTGRES_DB: hexascore
    ports: ["127.0.0.1:5433:5432"]
    # Mount one level above the data directory so pg_upgrade can run inside it (same as the spike).
    volumes: ["postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexascore"]
      interval: 2s
      retries: 30

  # ROADMAP says 1.0.2; E-002 found 1.0.4 as the latest stable tag, so 1.0.4 is pinned.
  # Dev-only credentials, not secrets; they must never be reused outside this file.
  rustfs:
    image: rustfs/rustfs:1.0.4
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: hexascore
      RUSTFS_SECRET_KEY: hexascore-local-secret
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["rustfs:/data"]
    # Health endpoint per https://docs.rustfs.com/installation/docker/ (/health on the S3 port).
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Built container for the QA gate (ROADMAP P1.I): docker compose --profile app up -d --wait
  # APP_KEY comes from .env (setup script) or the shell. Dev-only credentials, same as above.
  app-init:
    profiles: ["app"]
    build: .
    image: hexascore-app:${E2E_IMAGE_TAG:-e2e}
    depends_on:
      postgres: { condition: service_healthy }
    environment: &app-env
      APP_KEY: ${APP_KEY:?run setups/setup-unix.sh or vukem key:generate}
      DATABASE_URL: postgres://hexascore:hexascore@postgres:5432/hexascore?sslmode=disable
      SESSION_DRIVER: database
      # Debug level makes the log mail transport print message bodies, which is how the e2e suite reads verification and reset links.
      LOG_LEVEL: debug
      # The suite sends a distinct X-Forwarded-For per test so the strict auth rate limits (5 logins/min per IP) do not couple specs.
      TRUSTED_PROXIES: 172.16.0.0/12
      # Billing routes refuse to boot without Stripe settings; these are inert placeholders (no Stripe call is made by the auth, profile and api-keys specs).
      STRIPE_KEY: sk_test_placeholder_e2e
      STRIPE_WEBHOOK_SECRET: whsec_placeholder_e2e
      STRIPE_PRICE_PRO: price_placeholder_pro
      STRIPE_PRICE_BUSINESS: price_placeholder_business
    # Migrate, then seed DemoCatalog (1 admin, 50 users, 300 items); the seeder is idempotent, so a failure is real.
    entrypoint: ["/bin/sh", "-c", "/app/app migrate && /app/app db:seed --force DemoCatalog"]
    restart: "no"

  app:
    profiles: ["app"]
    image: hexascore-app:${E2E_IMAGE_TAG:-e2e}
    depends_on:
      app-init: { condition: service_completed_successfully }
    environment: *app-env
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/up"]
      interval: 3s
      retries: 20

volumes:
  postgres:
  rustfs:
