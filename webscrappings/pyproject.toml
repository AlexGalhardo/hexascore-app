[project]
name = "hexascore-ingest"
version = "0.1.0"
description = "Catalog ingestion for Hexascore (Wikidata, Wikipedia, Open Library, Steam, GOG)"
readme = "README.md"
# 3.14 is the floor because items.id is generated with the stdlib uuid.uuid7().
requires-python = ">=3.14"
dependencies = [
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
