# Hand-written project file. The package in hexascore/ is generated (`bun run sdk:generate:python`) with
# `--meta none`, so regenerating never touches this file, the README, the LICENSE or the tests.
[project]
name = "hexascore"
version = "0.1.0"
description = "Typed client for the Hexascore API (community scores for games, movies, TV series and books)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HexaScore" }]
requires-python = ">=3.11"
keywords = ["hexascore", "api", "sdk", "games", "movies", "series", "books", "ratings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Same runtime dependencies and ranges the generator (openapi-python-client 0.29.1) declares for its output.
dependencies = [
    "httpx>=0.23.1,<0.29.0",
    "attrs>=22.2.0",
]

[project.urls]
Homepage = "https://hexascore.app/docs"
Documentation = "https://hexascore.app/docs"
Repository = "https://github.com/AlexGalhardo/hexascore-app"
Issues = "https://github.com/AlexGalhardo/hexascore-app/issues"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hexascore"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
